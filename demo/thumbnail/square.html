<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "DM Sans"; src: url(../slides/fonts/DMSans-Bold.ttf); font-weight: 700; }
  body { margin: 0; width: 1080px; height: 1080px; background: #0b0f1a; position: relative; overflow: hidden; font-family: "DM Sans", sans-serif; }
  .frame { position: absolute; inset: 28px; border: 4px solid #2f578c; }
  .c { position: absolute; width: 64px; height: 64px; border: 0 solid #e9a13f; }
  .tl { left: 16px; top: 16px; border-width: 14px 0 0 14px; }
  .tr { right: 16px; top: 16px; border-width: 14px 14px 0 0; }
  .bl { left: 16px; bottom: 16px; border-width: 0 0 14px 14px; }
  .br { right: 16px; bottom: 16px; border-width: 0 14px 14px 0; }
  .mask { position: absolute; left: 50%; top: 190px; height: 360px; transform: translateX(-50%); image-rendering: pixelated; }
  h1 { position: absolute; left: 0; right: 0; top: 600px; margin: 0; text-align: center; font-size: 150px; line-height: 1; color: #ffcc6f; letter-spacing: -2px; }
  p { position: absolute; left: 0; right: 0; top: 790px; margin: 0; text-align: center; font-size: 44px; color: #ffffff; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
  <img class="mask" src="../../public/sprites/mask.png" alt="" />
  <h1>Blindspot</h1>
  <p>Private payments for AI agents</p>
</body>
</html>
